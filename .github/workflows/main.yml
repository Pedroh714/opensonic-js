
name: Build Open Sonic JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar o jogo
        run: npm run build

      - name: Criar ZIP do jogo compilado
        run: |
          mkdir -p package
          if [ -d dist ]; then cp -r dist package/; fi
          if [ -d public ]; then cp -r public package/; fi
          cd package
          zip -r ../opensonic-ready.zip .

      - name: Disponibilizar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: opensonic-ready
          path: opensonic-ready.zip
