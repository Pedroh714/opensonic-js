
name: Build Open Sonic JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Compilar o jogo
        run: npm run build

      - name: Guardar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: opensonic-js-build
          path: |
            dist/
            public/
          if-no-files-found: error
